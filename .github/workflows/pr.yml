name: PR flow

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: node (${{ matrix.app }})
    strategy:
      fail-fast: false
      matrix:
        app: [app, docs]
    uses: mr-chelyshkin/actions/.github/workflows/ci-node.yml@772ed02edbc40cbc539a507e0f55972da7cc7c8e # v3
    permissions:
      contents: read
    with:
      env-vars: '{"APP": "${{ matrix.app }}"}'
      cache-key-prefix: node-${{ matrix.app }}
      cache-dependency-path: ${{ matrix.app }}/package-lock.json

  terraform:
    name: Terraform ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        check: [fmt, validate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mr-chelyshkin/actions/task-run@772ed02edbc40cbc539a507e0f55972da7cc7c8e # v3
        with:
          task: ci/terraform/${{ matrix.check }}

  gate:
    if: always()
    needs: [node, terraform]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: mr-chelyshkin/actions/job-results-check@772ed02edbc40cbc539a507e0f55972da7cc7c8e # v3
        with:
          results: ${{ toJSON(needs) }}
